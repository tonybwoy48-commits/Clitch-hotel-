<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clitch Hotel - Admin Dashboard</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#f8f5f0;margin:0;padding:15px}
h1{color:#0f2a1a;text-align:center}h1 span{color:#d4af37}
.box{background:white;max-width:1100px;margin:auto;padding:20px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);margin-bottom:15px}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.btn{background:#d4af37;color:#0f2a1a;padding:12px 20px;border:none;border-radius:30px;font-weight:bold;width:100%;cursor:pointer}
.stats{display:flex;gap:10px;flex-wrap:wrap}.card{flex:1;min-width:120px;background:#0f2a1a;color:white;padding:15px;border-radius:12px;text-align:center}.card b{font-size:24px;color:#d4af37;display:block}.card span{font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#0f2a1a;color:white}
.small{padding:5px 8px;border:none;border-radius:5px;cursor:pointer;font-size:11px;margin:2px}
.green{background:#25D366;color:white}.red{background:red;color:white}.grey{background:#333;color:white}
.badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.Pending{background:#ffeaa7}.Confirmed{background:#d4edda}.Cancelled{background:#f8d7da}
</style>
</head>
<body>
<h1>CLITCH <span>HOTEL</span> - ADMIN</h1>
<div class="box" id="loginBox"><h2>Admin Login</h2><input type="password" id="pass" placeholder="Enter Password"><button class="btn" onclick="login()">LOGIN</button></div>
<div id="dash" style="display:none">
<div class="box"><div class="stats"><div class="card"><b id="total">0</b><span>Total Bookings</span></div><div class="card"><b id="today">0</b><span>Today</span></div><div class="card"><b id="pending">0</b><span>Pending</span></div><div class="card"><b id="confirmed">0</b><span>Confirmed</span></div><div class="card"><b id="revenue">GH₵ 0</b><span>Expected Revenue</span></div></div><input type="text" id="search" placeholder="🔍 Search by name or phone..." oninput="loadBookings()"><select id="filterRoom" onchange="loadBookings()"><option value="">All Rooms</option><option>Standard Room</option><option>Deluxe Room</option><option>Executive Room</option><option>Royal Suite</option></select><button class="btn" onclick="loadBookings()">🔄 Refresh</button></div>
<div class="box"><div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Nights</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="list"></tbody></table></div><p id="empty" style="text-align:center;color:#888">No bookings yet.</p><button class="small grey" onclick="clearAll()" style="padding:10px 20px">Clear All</button><br><br><a href="index.html">← Back to Website</a></div></div>
<script>
function login(){ if(document.getElementById('pass').value==='clitch123'){ document.getElementById('loginBox').style.display='none'; document.getElementById('dash').style.display='block'; loadBookings(); } else alert('Wrong password!'); }
function getData(){ return JSON.parse(localStorage.getItem('clitch_bookings')||'[]'); }
function saveData(d){ localStorage.setItem('clitch_bookings', JSON.stringify(d)); }
function calcNights(b){ if(b.nights) return b.nights; if(b.checkin && b.checkout){ let d = Math.ceil((new Date(b.checkout)-new Date(b.checkin))/(1000*60*60*24)); return d>0?d:0; } return 0; }
function calcTotal(b){ if(b.total) return b.total; let prices={ 'Standard':350, 'Deluxe':500, 'Executive':750, 'Royal':1200 }; let p=350; for(let k in prices){ if(b.room.includes(k)) p=prices[k]; } return calcNights(b)*p; }
function loadBookings(){ let data=getData(); let q=document.getElementById('search').value.toLowerCase(); let fr=document.getElementById('filterRoom').value; let filtered=data.filter(b=>(!q||b.name.toLowerCase().includes(q)||b.phone.includes(q))&&(!fr||b.room.includes(fr))); document.getElementById('total').innerText=data.length; document.getElementById('today').innerText=data.filter(b=>b.created.includes(new Date().toLocaleDateString())).length; document.getElementById('pending').innerText=data.filter(b=>(b.status||'Pending')==='Pending').length; document.getElementById('confirmed').innerText=data.filter(b=>b.status==='Confirmed').length; let rev = data.filter(b=>b.status!=='Cancelled').reduce((sum,b)=>sum+calcTotal(b),0); document.getElementById('revenue').innerText='GH₵ '+rev.toLocaleString(); let html=''; filtered.forEach((b)=>{ let realIndex=data.indexOf(b); let st=b.status||'Pending'; let n=calcNights(b); let t=calcTotal(b); html+=`<tr><td>${b.created}</td><td>${b.name}</td><td>${b.phone}</td><td>${b.room}</td><td>${b.checkin}</td><td>${b.checkout}</td><td><b>${n} nights</b></td><td><b>GH₵ ${t.toLocaleString()}</b></td><td><span class="badge ${st}">${st}</span></td><td><button class="small green" onclick="setStatus(${realIndex},'Confirmed')">✓ Confirm</button><button class="small red" onclick="setStatus(${realIndex},'Cancelled')">Cancel</button><a href="https://wa.me/${b.phone.replace(/[^0-9]/g,'')}" target="_blank"><button class="small green">WhatsApp</button></a><button class="small red" onclick="delOne(${realIndex})">Delete</button></td></tr>`; }); document.getElementById('list').innerHTML=html; document.getElementById('empty').style.display=filtered.length?'none':'block'; }
function setStatus(i,s){ let d=getData(); d[i].status=s; saveData(d); let guests=JSON.parse(localStorage.getItem('clitch_guests')||'[]'); let g=guests.find(x=>x.phone===d[i].phone); if(g) g.status=s; localStorage.setItem('clitch_guests', JSON.stringify(guests)); loadBookings(); }
function delOne(i){ let d=getData(); d.splice(i,1); saveData(d); loadBookings(); }
function clearAll(){ if(confirm('Delete ALL bookings?')){ localStorage.removeItem('clitch_bookings'); loadBookings(); } }
</script>
</body>
</html>
