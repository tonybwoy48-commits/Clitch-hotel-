<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clitch Hotel - Admin</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#f8f5f0;margin:0;padding:20px}
h1{color:#0f2a1a;text-align:center}h1 span{color:#d4af37}
.box{background:white;max-width:900px;margin:auto;padding:20px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px}
.btn{background:#d4af37;color:#0f2a1a;padding:12px 20px;border:none;border-radius:30px;font-weight:bold;width:100%;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#0f2a1a;color:white}
.del{background:red;color:white;border:none;padding:5px 10px;border-radius:5px;cursor:pointer}
.clear{background:#333;color:white;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<h1>CLITCH <span>HOTEL</span> - ADMIN</h1>
<div class="box" id="loginBox">
<h2>Admin Login</h2>
<input type="password" id="pass" placeholder="Enter Admin Password">
<button class="btn" onclick="login()">LOGIN</button>
<p style="font-size:12px;color:#888;text-align:center">Default password: clitch123</p>
</div>

<div class="box" id="dash" style="display:none">
<h2>All Bookings (<span id="count">0</span>)</h2>
<button onclick="loadBookings()">🔄 Refresh</button>
<div style="overflow-x:auto">
<table><thead><tr><th>Date Booked</th><th>Name</th><th>Phone</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Guests</th><th></th></tr></thead><tbody id="list"></tbody></table>
</div>
<p id="empty" style="text-align:center;color:#888">No bookings yet.</p>
<button class="clear" onclick="clearAll()">Clear All Bookings</button>
<br><br><a href="index.html">← Back to Website</a>
</div>

<script>
function login(){
  if(document.getElementById('pass').value==='clitch123'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('dash').style.display='block';
    loadBookings();
  } else { alert('Wrong password!'); }
}
function loadBookings(){
  let data = JSON.parse(localStorage.getItem('clitch_bookings')||'[]');
  document.getElementById('count').innerText = data.length;
  let html='';
  data.forEach((b,i)=>{
    html+=`<tr><td>${b.created}</td><td>${b.name}</td><td>${b.phone}</td><td>${b.room}</td><td>${b.checkin}</td><td>${b.checkout}</td><td>${b.guests}</td><td><button class="del" onclick="delOne(${i})">X</button></td></tr>`;
  });
  document.getElementById('list').innerHTML=html;
  document.getElementById('empty').style.display = data.length?'none':'block';
}
function delOne(i){
  let data=JSON.parse(localStorage.getItem('clitch_bookings')||'[]');
  data.splice(i,1); localStorage.setItem('clitch_bookings',JSON.stringify(data)); loadBookings();
}
function clearAll(){ if(confirm('Delete all?')){ localStorage.removeItem('clitch_bookings'); loadBookings(); } }
</script>
</body>
</html>
